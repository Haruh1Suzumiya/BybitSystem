<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybitデルタニュートラル - ダッシュボード</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: #2563eb;
        }
        input:focus + .toggle-slider {
            box-shadow: 0 0 1px #2563eb;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        .card {
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .status-indicator {
            transition: all 0.5s ease;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white rounded-lg p-6 mb-8 shadow-lg">
            <h1 class="text-4xl font-bold text-center">デルタニュートラル管理画面</h1>
            <p class="text-center mt-2 text-blue-100">Bybit FRアービトラージシステム</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- システム制御 -->
            <div class="bg-white shadow-lg rounded-lg px-6 pt-6 pb-6 card">
                <h2 class="text-xl font-semibold mb-4 text-center">システム制御</h2>
                <div class="flex items-center justify-center">
                    <span class="mr-4 text-lg">実行:</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleArbitrage">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="ml-4 text-lg font-semibold" id="arbitrageStatus">停止中</span>
                </div>
            </div>

            <!-- USDT残高 -->
            <div class="bg-white shadow-lg rounded-lg px-6 pt-6 pb-6 card">
                <h2 class="text-xl font-semibold mb-4 text-center">USDT残高</h2>
                <p id="usdtBalance" class="text-3xl font-bold text-center">読み込み中...</p>
                <p class="text-center text-sm text-gray-500 mt-2">最終更新: <span id="balanceUpdateTime">-</span></p>
            </div>
            
            <!-- 現在のポジション -->
            <div class="bg-white shadow-lg rounded-lg px-6 pt-6 pb-6 card">
                <h2 class="text-xl font-semibold mb-4 text-center">現在のポジション</h2>
                <div id="noPosition" class="text-center">
                    <p class="text-gray-500">ポジションなし</p>
                </div>
                <div id="hasPosition" class="hidden">
                    <p class="text-center font-bold text-xl" id="positionSymbol">-</p>
                    <div class="flex justify-between mt-3">
                        <span class="text-gray-600">現在FR:</span>
                        <span class="font-semibold" id="positionFR">-</span>
                    </div>
                    <div class="flex justify-between mt-1">
                        <span class="text-gray-600">FR更新回数:</span>
                        <span class="font-semibold" id="frChangeCount">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- システム状態 -->
        <div class="bg-white shadow-lg rounded-lg px-6 pt-6 pb-6 mb-8 card">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">システム状態</h2>
                <div class="flex items-center">
                    <span class="mr-2 text-gray-600">ステータス:</span>
                    <span id="status" class="px-3 py-1 rounded-full text-white bg-gray-500 status-indicator">準備完了</span>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center">
                <div id="statusContainer" class="w-full flex justify-center">
                    <div class="flex items-center justify-between w-4/5 max-w-2xl">
                        <div class="flex flex-col items-center">
                            <div id="step1" class="rounded-full h-12 w-12 flex items-center justify-center bg-gray-300 text-white mb-2">
                                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                            <span class="text-sm text-gray-500">FR解析中</span>
                        </div>
                        <div class="h-1 w-24 bg-gray-300" id="line1"></div>
                        <div class="flex flex-col items-center">
                            <div id="step2" class="rounded-full h-12 w-12 flex items-center justify-center bg-gray-300 text-white mb-2">
                                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                            <span class="text-sm text-gray-500">ポジション発注</span>
                        </div>
                        <div class="h-1 w-24 bg-gray-300" id="line2"></div>
                        <div class="flex flex-col items-center">
                            <div id="step3" class="rounded-full h-12 w-12 flex items-center justify-center bg-gray-300 text-white mb-2">
                                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                            <span class="text-sm text-gray-500">正常完了</span>
                        </div>
                    </div>
                </div>
                <div id="statusMessage" class="mt-4 text-lg font-medium text-center">システム停止中</div>
            </div>
        </div>
        
        <!-- 上位機会 -->
        <div class="bg-white shadow-lg rounded-lg px-6 pt-6 pb-6 mb-8 card">
            <h2 class="text-xl font-semibold mb-4">上位FR機会</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ペア</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">現在FR</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">累積FR</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="opportunitiesTable">
                        <tr>
                            <td colspan="3" class="px-6 py-4 text-center text-gray-500">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="text-right mt-4">
                <button id="refreshOpportunities" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition duration-200">
                    更新
                </button>
            </div>
        </div>

        <!-- 設定リンク -->
        <div class="text-center mt-8">
            <a href="/settings" class="inline-block bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-full text-lg transition duration-300 ease-in-out transform hover:scale-105">
                詳細設定
            </a>
        </div>
    </div>

    <!-- 停止確認モーダル -->
    <div id="stopConfirmationModal" class="fixed z-10 inset-0 overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
                                システムを停止しますか？
                            </h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500">
                                    システムを停止すると、現在のポジションが全てクローズされます。本当に停止しますか？
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="confirmStop" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:ml-3 sm:w-auto sm:text-sm">
                        停止
                    </button>
                    <button type="button" id="cancelStop" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        キャンセル
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const toggleArbitrageButton = document.getElementById('toggleArbitrage');
        const arbitrageStatus = document.getElementById('arbitrageStatus');
        const status = document.getElementById('status');
        const usdtBalanceElement = document.getElementById('usdtBalance');
        const balanceUpdateTimeElement = document.getElementById('balanceUpdateTime');
        const stopConfirmationModal = document.getElementById('stopConfirmationModal');
        const confirmStopButton = document.getElementById('confirmStop');
        const cancelStopButton = document.getElementById('cancelStop');
        const opportunitiesTable = document.getElementById('opportunitiesTable');
        const refreshOpportunitiesButton = document.getElementById('refreshOpportunities');
        const noPositionElement = document.getElementById('noPosition');
        const hasPositionElement = document.getElementById('hasPosition');
        const positionSymbolElement = document.getElementById('positionSymbol');
        const positionFRElement = document.getElementById('positionFR');
        const frChangeCountElement = document.getElementById('frChangeCount');
        const statusMessageElement = document.getElementById('statusMessage');
        
        // ステータスステップの要素
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const line1 = document.getElementById('line1');
        const line2 = document.getElementById('line2');
    
        let isArbitrageRunning = false;
        let currentLogs = [];
        let processingStep = 0; // 現在の処理ステップ（0: 未開始, 1: FR解析中, 2: ポジション発注, 3: 正常完了）
        
        // ステータス表示を更新する関数
        function updateStatusDisplay(step, message) {
            processingStep = step;
            
            // すべてのステップをリセット
            [step1, step2, step3].forEach(stepElem => {
                stepElem.classList.remove('bg-blue-600', 'bg-green-500', 'bg-yellow-500');
                stepElem.classList.add('bg-gray-300');
            });
            
            [line1, line2].forEach(lineElem => {
                lineElem.classList.remove('bg-blue-600', 'bg-green-500');
                lineElem.classList.add('bg-gray-300');
            });
            
            // 現在のステップまで強調表示
            if (step >= 1) {
                step1.classList.remove('bg-gray-300');
                step1.classList.add('bg-blue-600');
            }
            
            if (step >= 2) {
                line1.classList.remove('bg-gray-300');
                line1.classList.add('bg-blue-600');
                step2.classList.remove('bg-gray-300');
                step2.classList.add('bg-yellow-500');
            }
            
            if (step >= 3) {
                line2.classList.remove('bg-gray-300');
                line2.classList.add('bg-green-500');
                step2.classList.remove('bg-yellow-500');
                step2.classList.add('bg-blue-600');
                step3.classList.remove('bg-gray-300');
                step3.classList.add('bg-green-500');
            }
            
            // ステータスメッセージを更新
            statusMessageElement.textContent = message;
        }
    
        function updateUSDTBalance() {
            fetch('/get_usdt_balance')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        usdtBalanceElement.textContent = `${data.usdt_balance} USDT`;
                        balanceUpdateTimeElement.textContent = new Date().toLocaleTimeString();
                    } else {
                        console.error('Failed to get USDT balance:', data.error);
                    }
                })
                .catch(error => {
                    console.error('Error updating USDT balance:', error);
                });
        }
    
        function updatePositionInfo(position) {
            if (position.has_position) {
                noPositionElement.classList.add('hidden');
                hasPositionElement.classList.remove('hidden');
                
                positionSymbolElement.textContent = `${position.linear_symbol || '-'}`;
                positionFRElement.textContent = position.fr !== null ? `${position.fr.toFixed(4)}%` : '-';
                frChangeCountElement.textContent = position.fr_change_count || '0';
                
                // ポジションがある場合は処理ステップを3に設定
                updateStatusDisplay(3, `ポジション保有中: ${position.linear_symbol}`);
            } else {
                noPositionElement.classList.remove('hidden');
                hasPositionElement.classList.add('hidden');
                
                // システムが実行中なら解析中表示に戻す
                if (isArbitrageRunning) {
                    updateStatusDisplay(1, "FR解析中");
                } else {
                    updateStatusDisplay(0, "システム停止中");
                }
            }
        }
    
        function updateArbitrageStatus() {
            fetch('/arbitrage_status')
                .then(response => response.json())
                .then(data => {
                    // ステータスを更新
                    status.textContent = data.status;
                    status.className = `px-3 py-1 rounded-full text-white ${data.is_running ? 'bg-green-500' : 'bg-gray-500'} status-indicator`;
                    
                    // トグルボタンを更新
                    isArbitrageRunning = data.is_running;
                    toggleArbitrageButton.checked = isArbitrageRunning;
                    arbitrageStatus.textContent = isArbitrageRunning ? '実行中' : '停止中';
                    
                    // ログメッセージからステータスを判断
                    if (isArbitrageRunning) {
                        if (!data.position.has_position) {
                            // ポジションがない場合は解析中
                            updateStatusDisplay(1, "FR解析中");
                            
                            // ログを確認して処理状態を判定
                            if (data.logs && data.logs.length > 0) {
                                for (let i = data.logs.length - 1; i >= 0; i--) {
                                    const log = data.logs[i];
                                    
                                    if (log.includes("試行:") || log.includes("Attempting arbitrage:")) {
                                        updateStatusDisplay(2, "ポジション発注中");
                                        break;
                                    }
                                }
                            }
                        } else {
                            // ポジションがある場合は完了状態
                            updateStatusDisplay(3, `ポジション保有中: ${data.position.linear_symbol}`);
                        }
                    } else {
                        // 停止中
                        updateStatusDisplay(0, "システム停止中");
                    }
                    
                    // ポジション情報を更新
                    updatePositionInfo(data.position);
                })
                .catch(error => {
                    console.error('Error updating arbitrage status:', error);
                });
        }
    
        function loadOpportunities() {
            fetch('/get_top_opportunities')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.opportunities) {
                        opportunitiesTable.innerHTML = '';
                        
                        if (data.opportunities.length === 0) {
                            const row = document.createElement('tr');
                            row.innerHTML = `<td colspan="3" class="px-6 py-4 text-center text-gray-500">利用可能な機会がありません</td>`;
                            opportunitiesTable.appendChild(row);
                        } else {
                            data.opportunities.forEach(opp => {
                                const row = document.createElement('tr');
                                row.className = 'hover:bg-gray-50';
                                row.innerHTML = `
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="font-medium text-gray-900">${opp.linear_symbol}</div>
                                        <div class="text-sm text-gray-500">${opp.spot_symbol}</div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${opp.current_fr > 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                            ${opp.current_fr.toFixed(4)}%
                                        </span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${opp.cumulative_fr > 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                            ${opp.cumulative_fr.toFixed(4)}%
                                        </span>
                                    </td>
                                `;
                                opportunitiesTable.appendChild(row);
                            });
                        }
                    } else {
                        opportunitiesTable.innerHTML = `
                            <tr>
                                <td colspan="3" class="px-6 py-4 text-center text-red-500">
                                    データの取得に失敗しました
                                </td>
                            </tr>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error loading opportunities:', error);
                    opportunitiesTable.innerHTML = `
                        <tr>
                            <td colspan="3" class="px-6 py-4 text-center text-red-500">
                                エラーが発生しました
                            </td>
                        </tr>
                    `;
                });
        }
    
        function showStopConfirmationModal() {
            stopConfirmationModal.classList.remove('hidden');
        }
    
        function hideStopConfirmationModal() {
            stopConfirmationModal.classList.add('hidden');
        }
    
        function startArbitrage() {
            fetch('/toggle_arbitrage/start', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        isArbitrageRunning = data.is_running;
                        arbitrageStatus.textContent = isArbitrageRunning ? '実行中' : '停止中';
                        toggleArbitrageButton.checked = isArbitrageRunning;
                        
                        if (isArbitrageRunning) {
                            updateStatusDisplay(1, "FR解析中");
                            updateUSDTBalance();
                        }
                        
                        updateArbitrageStatus();
                    } else {
                        console.error('Failed to toggle arbitrage:', data.message);
                        toggleArbitrageButton.checked = !toggleArbitrageButton.checked;
                    }
                })
                .catch(error => {
                    console.error('Error toggling arbitrage:', error);
                    toggleArbitrageButton.checked = isArbitrageRunning;
                });
        }
    
        function stopArbitrage() {
            fetch('/toggle_arbitrage/stop', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        isArbitrageRunning = data.is_running;
                        arbitrageStatus.textContent = isArbitrageRunning ? '実行中' : '停止中';
                        toggleArbitrageButton.checked = isArbitrageRunning;
                        
                        if (!isArbitrageRunning) {
                            updateStatusDisplay(0, "システム停止中");
                        }
                        
                        updateArbitrageStatus();
                    } else {
                        console.error('Failed to toggle arbitrage:', data.message);
                        toggleArbitrageButton.checked = !toggleArbitrageButton.checked;
                    }
                })
                .catch(error => {
                    console.error('Error toggling arbitrage:', error);
                    toggleArbitrageButton.checked = isArbitrageRunning;
                });
        }
    
        // イベントリスナー設定
        toggleArbitrageButton.addEventListener('change', function() {
            if (this.checked) {
                startArbitrage();
            } else {
                showStopConfirmationModal();
            }
        });
    
        confirmStopButton.addEventListener('click', function() {
            hideStopConfirmationModal();
            stopArbitrage();
        });
    
        cancelStopButton.addEventListener('click', function() {
            hideStopConfirmationModal();
            toggleArbitrageButton.checked = true;
        });
        
        refreshOpportunitiesButton.addEventListener('click', function() {
            loadOpportunities();
        });
    
        // 定期更新処理
        setInterval(updateUSDTBalance, 60000);  // 1分ごとにUSDT残高を更新
        setInterval(updateArbitrageStatus, 5000);  // 5秒ごとにステータスを更新
        setInterval(loadOpportunities, 300000);  // 5分ごとに機会リストを更新
    
        // 初期処理
        document.addEventListener('DOMContentLoaded', function() {
            updateArbitrageStatus();
            updateUSDTBalance();
            loadOpportunities();
            updateStatusDisplay(0, "システム停止中");
        });
    </script>
</body>
</html>
