<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詳細設定 - デルタニュートラル</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: #2563eb;
        }
        input:focus + .toggle-slider {
            box-shadow: 0 0 1px #2563eb;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        .card {
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white rounded-lg p-6 mb-8 shadow-lg">
            <h1 class="text-4xl font-bold mb-2 text-center">詳細設定</h1>
            <p class="text-center text-blue-100">デルタニュートラルシステム</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- API設定 -->
            <div class="bg-white shadow-lg rounded-lg px-6 pt-6 pb-6 card col-span-1 md:col-span-2">
                <h2 class="text-xl font-semibold mb-4">API設定</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="api_key">
                        APIキー
                    </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="api_key" type="text" placeholder="APIキー">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="api_secret">
                        APIシークレット
                    </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="api_secret" type="password" placeholder="APIシークレット">
                </div>
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" class="form-checkbox" id="testnet">
                        <span class="ml-2">テストネットモードを使用</span>
                    </label>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="usdt_balance">
                        USDT残高
                    </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-100" id="usdt_balance" type="text" readonly>
                </div>
                <div class="flex items-center justify-end">
                    <button id="updateConfig" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300 ease-in-out">
                        設定を更新
                    </button>
                </div>
            </div>

            <!-- Funding Rate設定 -->
            <div class="bg-white shadow-lg rounded-lg px-6 pt-6 pb-6 card">
                <h2 class="text-xl font-semibold mb-4">Funding Rate設定</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="funding_times">
                        FR時間 (HH:MM形式, カンマ区切り)
                    </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="funding_times" type="text" placeholder="01:00,09:00,17:00">
                </div>
                <div class="flex items-center justify-end">
                    <button id="updateFundingConfig" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300 ease-in-out">
                        更新
                    </button>
                </div>
            </div>
            
            <!-- 取引設定 -->
            <div class="bg-white shadow-lg rounded-lg px-6 pt-6 pb-6 card">
                <h2 class="text-xl font-semibold mb-4">取引設定</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="leverage">
                        レバレッジ
                    </label>
                    <select class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="leverage">
                        <option value="1">1倍</option>
                        <option value="2">2倍</option>
                        <option value="3">3倍</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="max_trade_amount">
                        最大取引額 (USDT)
                    </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="max_trade_amount" type="text" placeholder="1000000">
                </div>
                <div class="flex items-center justify-end">
                    <button id="updateTradeConfig" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300 ease-in-out">
                        更新
                    </button>
                </div>
            </div>
        </div>

        <!-- 通知設定 -->
        <div class="bg-white shadow-lg rounded-lg px-6 pt-6 pb-6 mb-8 card">
            <h2 class="text-xl font-semibold mb-4">開発中の機能</h2>
            <div class="text-center text-gray-600 py-6">
                <p>今後のアップデートをお待ちください。</p>
            </div>
        </div>

        <div class="text-center mt-8">
            <a href="/dashboard" class="inline-block bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-full text-lg transition duration-300 ease-in-out transform hover:scale-105">
                ダッシュボードに戻る
            </a>
        </div>
    </div>

    <!-- 成功通知 -->
    <div id="successNotification" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg transition-all duration-500 transform translate-y-20 opacity-0">
        設定が更新されました
    </div>

    <!-- エラー通知 -->
    <div id="errorNotification" class="fixed bottom-4 right-4 bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg transition-all duration-500 transform translate-y-20 opacity-0">
        エラーが発生しました
    </div>

    <script>
        // DOM要素
        const apiKeyInput = document.getElementById('api_key');
        const apiSecretInput = document.getElementById('api_secret');
        const testnetCheckbox = document.getElementById('testnet');
        const usdtBalanceInput = document.getElementById('usdt_balance');
        const updateConfigButton = document.getElementById('updateConfig');
        const fundingTimesInput = document.getElementById('funding_times');
        const updateFundingConfigButton = document.getElementById('updateFundingConfig');
        const leverageSelect = document.getElementById('leverage');
        const maxTradeAmountInput = document.getElementById('max_trade_amount');
        const updateTradeConfigButton = document.getElementById('updateTradeConfig');
        const successNotification = document.getElementById('successNotification');
        const errorNotification = document.getElementById('errorNotification');

        // 設定更新関数
        function updateConfig() {
            const apiKey = apiKeyInput.value;
            const apiSecret = apiSecretInput.value;
            const testnet = testnetCheckbox.checked;

            fetch('/update_api_keys', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    api_key: apiKey, 
                    api_secret: apiSecret,
                    testnet: testnet
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification(successNotification, '設定が更新されました');
                    updateUSDTBalance();
                } else {
                    showNotification(errorNotification, 'エラー: ' + (data.error || '設定の更新に失敗しました'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification(errorNotification, 'サーバーエラーが発生しました');
            });
        }

        // FR設定更新関数
        function updateFundingConfig() {
            const fundingTimes = fundingTimesInput.value;
            
            // バリデーション
            const timePattern = /^([01]\d|2[0-3]):([0-5]\d)(,([01]\d|2[0-3]):([0-5]\d))*$/;
            if (!timePattern.test(fundingTimes)) {
                showNotification(errorNotification, '無効な時間形式です。HH:MM形式でカンマ区切りで入力してください。');
                return;
            }
            
            // 実際の実装ではサーバーに送信する処理を追加
            // 現在はモックで成功通知のみ表示
            showNotification(successNotification, 'FR時間が更新されました');
        }

        // 取引設定更新関数
        function updateTradeConfig() {
            const leverage = leverageSelect.value;
            const maxTradeAmount = maxTradeAmountInput.value;
            
            // バリデーション
            if (isNaN(maxTradeAmount) || maxTradeAmount <= 0) {
                showNotification(errorNotification, '最大取引額は正の数値を入力してください');
                return;
            }
            
            // 実際の実装ではサーバーに送信する処理を追加
            // 現在はモックで成功通知のみ表示
            showNotification(successNotification, '取引設定が更新されました');
        }

        // USDT残高更新関数
        function updateUSDTBalance() {
            fetch('/get_usdt_balance')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        usdtBalanceInput.value = data.usdt_balance;
                    } else {
                        console.error('USDT残高の取得に失敗しました:', data.error);
                    }
                })
                .catch(error => console.error('USDT残高の更新中にエラーが発生しました:', error));
        }

        // 通知表示関数
        function showNotification(element, message) {
            element.textContent = message;
            element.classList.remove('translate-y-20', 'opacity-0');
            element.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                element.classList.remove('translate-y-0', 'opacity-100');
                element.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // イベントリスナー設定
        updateConfigButton.addEventListener('click', updateConfig);
        updateFundingConfigButton.addEventListener('click', updateFundingConfig);
        updateTradeConfigButton.addEventListener('click', updateTradeConfig);

        // 初期データ読み込み
        window.addEventListener('load', function() {
            // API設定を読み込み
            fetch('/get_config')
                .then(response => response.json())
                .then(data => {
                    apiKeyInput.value = data.api_key || '';
                    apiSecretInput.value = data.api_secret || '';
                    testnetCheckbox.checked = data.testnet || false;
                    
                    // 他の設定も読み込む（実際の実装ではサーバーからの読み込み処理を追加）
                    fundingTimesInput.value = '01:00,09:00,17:00';
                    leverageSelect.value = '1';
                    maxTradeAmountInput.value = '1000000';
                    
                    // USDT残高を取得
                    updateUSDTBalance();
                })
                .catch(error => {
                    console.error('設定の読み込みに失敗しました:', error);
                    showNotification(errorNotification, '設定の読み込みに失敗しました');
                });
        });
    </script>
</body>
</html>
